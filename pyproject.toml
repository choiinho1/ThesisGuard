[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "thesisguard-agent"
version = "0.1.0"
description = "Evidence-grounded LangGraph agent core for ThesisGuard"
readme = "docs/AI_AGENT.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-core==1.4.9",
  "langgraph==1.2.9",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "pytest==9.1.1",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]
evaluation = [
  "ragas==0.4.3",
  # Ragas 0.4.3 still imports the legacy VertexAI module removed in 0.4.x.
  "langchain-community==0.3.31",
]

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
