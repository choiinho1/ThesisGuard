<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ThesisGuard MVP</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="./js/api.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// All backend I/O goes through ThesisGuardAPI (js/api.js) so this file never
// calls fetch() directly. That lets A keep building UI in mock mode while B's
// server is down or its schema is mid-change, and flip to "live" with no code
// change once B's endpoint matches backend/app/schemas.py.

const STATUS_STYLES = {
  STRONGLY_STRENGTHENED: "bg-emerald-500/20 text-emerald-300 border-emerald-500/40",
  STRENGTHENED: "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
  UNCHANGED: "bg-slate-500/10 text-slate-300 border-slate-500/30",
  WEAKENED: "bg-amber-500/10 text-amber-300 border-amber-500/30",
  STRONGLY_WEAKENED: "bg-orange-500/15 text-orange-300 border-orange-500/40",
  BROKEN: "bg-red-500/15 text-red-300 border-red-500/40",
};

const CLASSIFICATION_STYLES = {
  SUPPORT: "bg-emerald-500/10 text-emerald-300 border-emerald-500/30",
  CONTRADICT: "bg-red-500/10 text-red-300 border-red-500/30",
  NEUTRAL: "bg-slate-500/10 text-slate-300 border-slate-500/30",
  UNCERTAIN: "bg-amber-500/10 text-amber-300 border-amber-500/30",
};

function StatusBadge({ status }) {
  if (!status) return <span className="text-slate-500 text-sm">논리 미등록</span>;
  const cls = STATUS_STYLES[status] || STATUS_STYLES.UNCHANGED;
  return (
    <span className={`inline-block px-2 py-0.5 rounded-full border text-xs font-medium ${cls}`}>
      {status}
    </span>
  );
}

function ConfidenceGauge({ value }) {
  if (value === null || value === undefined) {
    return <div className="text-3xl font-bold text-slate-600">--</div>;
  }
  let color = "text-slate-300";
  if (value >= 80) color = "text-emerald-400";
  else if (value >= 60) color = "text-slate-200";
  else if (value >= 40) color = "text-amber-400";
  else color = "text-red-400";
  return <div className={`text-3xl font-bold ${color}`}>{value}</div>;
}

function HoldingCard({ holding, onClick }) {
  const hasSizing = holding.quantity || holding.avg_price || holding.target_weight;
  return (
    <button
      onClick={onClick}
      className="text-left bg-slate-900 border border-slate-800 rounded-xl p-4 hover:border-slate-600 transition w-full"
    >
      <div className="flex justify-between items-start">
        <div>
          <div className="text-lg font-semibold">{holding.ticker}</div>
          {hasSizing ? (
            <div className="text-xs text-slate-500">
              목표비중 {(holding.target_weight * 100).toFixed(0)}% · 수량 {holding.quantity} · 평단 ${holding.avg_price}
            </div>
          ) : (
            <div className="text-xs text-slate-600">{holding.has_thesis ? "논리 등록됨" : "논리 미등록"}</div>
          )}
        </div>
        <ConfidenceGauge value={holding.latest_confidence} />
      </div>
      <div className="mt-3">
        <StatusBadge status={holding.latest_status} />
      </div>
    </button>
  );
}

const SORTERS = {
  score_asc: {
    label: "점수 낮은순",
    fn: (a, b) => (a.latest_confidence ?? -1) - (b.latest_confidence ?? -1),
  },
  score_desc: {
    label: "점수 높은순",
    fn: (a, b) => (b.latest_confidence ?? -1) - (a.latest_confidence ?? -1),
  },
  ticker: {
    label: "티커순",
    fn: (a, b) => a.ticker.localeCompare(b.ticker),
  },
};

function QuickAddForm({ onAdded }) {
  const [open, setOpen] = useState(false);
  const [ticker, setTicker] = useState("");
  const [rawText, setRawText] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);

  const reset = () => {
    setTicker("");
    setRawText("");
    setOpen(false);
  };

  const submit = async () => {
    const t = ticker.trim().toUpperCase();
    if (!t || !rawText.trim()) return;
    setSubmitting(true);
    setError(null);
    try {
      const holding = await ThesisGuardAPI.quickAddHolding(t, rawText);
      reset();
      onAdded && onAdded(holding);
    } catch (e) {
      setError(String(e));
    } finally {
      setSubmitting(false);
    }
  };

  if (!open) {
    return (
      <button
        onClick={() => setOpen(true)}
        className="w-full text-left bg-slate-900 border border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-4 text-slate-400 hover:text-indigo-300 transition text-sm font-medium"
      >
        + 티커 추가
      </button>
    );
  }

  return (
    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
      <div className="flex items-center justify-between mb-3">
        <h3 className="font-semibold">새 티커 등록</h3>
        <button onClick={reset} className="text-slate-500 hover:text-slate-300 text-sm">닫기</button>
      </div>
      <input
        className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-sm mb-2 uppercase"
        placeholder="Ticker (예: NVDA)"
        value={ticker}
        onChange={(e) => setTicker(e.target.value)}
        autoFocus
      />
      <textarea
        className="w-full h-24 bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm"
        placeholder="왜 샀는지/사려는지 자연어로 적으면 OpenAI가 Main Thesis / 핵심 전제 / 리스크로 구조화합니다."
        value={rawText}
        onChange={(e) => setRawText(e.target.value)}
      />
      {error && <div className="text-red-400 text-sm mt-2">{error}</div>}
      <button
        onClick={submit}
        disabled={submitting || !ticker.trim() || !rawText.trim()}
        className="mt-3 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 px-4 py-2 rounded-lg text-sm font-medium"
      >
        {submitting ? "구조화 중... (LLM 호출)" : "추가"}
      </button>
    </div>
  );
}

function RepositoryView({ portfolios, onSelectHolding, onAdded }) {
  const [sortKey, setSortKey] = useState("score_asc");
  const holdings = portfolios.flatMap((p) => p.holdings);
  const sorted = [...holdings].sort(SORTERS[sortKey].fn);

  return (
    <div className="space-y-6">
      <QuickAddForm onAdded={onAdded} />

      <div className="flex items-center justify-between">
        <h2 className="text-lg font-semibold">
          내 티커 <span className="text-slate-500 font-normal">({holdings.length})</span>
        </h2>
        <div className="flex items-center gap-1 text-xs">
          {Object.entries(SORTERS).map(([key, s]) => (
            <button
              key={key}
              onClick={() => setSortKey(key)}
              className={`px-2 py-1 rounded-md ${
                sortKey === key ? "bg-indigo-600 text-white" : "text-slate-500 hover:text-slate-300"
              }`}
            >
              {s.label}
            </button>
          ))}
        </div>
      </div>

      {holdings.length === 0 ? (
        <div className="text-slate-500 text-sm">
          아직 등록된 티커가 없습니다. 위에서 티커와 투자 논리를 적어 추가해보세요.
        </div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {sorted.map((h) => (
            <HoldingCard key={h.id} holding={h} onClick={() => onSelectHolding(h)} />
          ))}
        </div>
      )}
    </div>
  );
}

function ThesisRegisterForm({ holding, onRegistered }) {
  const [rawText, setRawText] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);

  const submit = async () => {
    if (!rawText.trim()) return;
    setSubmitting(true);
    setError(null);
    try {
      const thesis = await ThesisGuardAPI.createThesis(holding.id, rawText);
      onRegistered(thesis);
    } catch (e) {
      setError(String(e));
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
      <h3 className="font-semibold mb-2">{holding.ticker} 투자 논리 등록</h3>
      <p className="text-sm text-slate-500 mb-3">
        자연어로 매수 이유를 적으면 OpenAI가 Main Thesis / 핵심 전제 / 리스크로 구조화합니다. (실제 LLM 호출)
      </p>
      <textarea
        className="w-full h-28 bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm"
        placeholder="예: Broadcom은 AI 데이터센터 네트워크와 Custom ASIC 시장에서 성장할 것이며..."
        value={rawText}
        onChange={(e) => setRawText(e.target.value)}
      />
      {error && <div className="text-red-400 text-sm mt-2">{error}</div>}
      <button
        onClick={submit}
        disabled={submitting}
        className="mt-3 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 px-4 py-2 rounded-lg text-sm font-medium"
      >
        {submitting ? "구조화 중... (LLM 호출)" : "Thesis 등록"}
      </button>
    </div>
  );
}

function ThesisDetail({ holding, onBack }) {
  const [thesis, setThesis] = useState(null);
  const [loading, setLoading] = useState(true);
  const [analyzing, setAnalyzing] = useState(false);
  const [analyzeResult, setAnalyzeResult] = useState(null);
  const [error, setError] = useState(null);

  const loadThesis = useCallback(async () => {
    setLoading(true);
    try {
      const t = await ThesisGuardAPI.getThesisByHolding(holding.id);
      setThesis(t);
    } catch (e) {
      if (e.status === 404) {
        setThesis(null);
      } else {
        setError(String(e));
      }
    } finally {
      setLoading(false);
    }
  }, [holding.id]);

  useEffect(() => { loadThesis(); }, [loadThesis]);

  const runAnalysis = async () => {
    if (!thesis) return;
    setAnalyzing(true);
    setAnalyzeResult(null);
    setError(null);
    try {
      const result = await ThesisGuardAPI.analyzeThesis(thesis.id);
      setAnalyzeResult(result);
      await loadThesis();
    } catch (e) {
      setError(String(e));
    } finally {
      setAnalyzing(false);
    }
  };

  return (
    <div>
      <button onClick={onBack} className="text-sm text-slate-400 hover:text-slate-200 mb-4">&larr; 목록으로</button>
      <h2 className="text-2xl font-bold mb-4">{holding.ticker}</h2>

      {error && <div className="text-red-400 text-sm mb-4">{error}</div>}

      {loading && <div className="text-slate-500">불러오는 중...</div>}

      {!loading && !thesis && (
        <ThesisRegisterForm holding={holding} onRegistered={(t) => setThesis(t)} />
      )}

      {!loading && thesis && (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <div className="flex justify-between items-start mb-3">
              <h3 className="font-semibold">구조화된 투자 논리</h3>
              <button
                onClick={runAnalysis}
                disabled={analyzing}
                className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 px-4 py-2 rounded-lg text-sm font-medium"
              >
                {analyzing ? "파이프라인 실행 중... (Research→Evidence→Bull/Bear→Judge)" : "신규 정보로 재분석 실행"}
              </button>
            </div>
            <p className="text-sm mb-3"><span className="text-slate-500">Main Thesis: </span>{thesis.main_thesis}</p>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <div className="text-xs uppercase text-slate-500 mb-1">핵심 전제</div>
                <ul className="text-sm space-y-1 list-disc list-inside text-slate-300">
                  {thesis.key_premises.map((p, i) => <li key={i}>{p}</li>)}
                </ul>
              </div>
              <div>
                <div className="text-xs uppercase text-slate-500 mb-1">주요 리스크</div>
                <ul className="text-sm space-y-1 list-disc list-inside text-slate-300">
                  {thesis.risks.map((r, i) => <li key={i}>{r}</li>)}
                </ul>
              </div>
            </div>
          </div>

          {analyzeResult && (
            <div className="bg-slate-900 border border-indigo-800/50 rounded-xl p-5">
              <h3 className="font-semibold mb-3">최신 분석 결과</h3>
              <div className="flex items-center gap-6 mb-4">
                <div>
                  <div className="text-xs text-slate-500">Confidence</div>
                  <div className="text-2xl font-bold">
                    {analyzeResult.previous_confidence} <span className="text-slate-500">&rarr;</span> {analyzeResult.new_confidence}
                  </div>
                </div>
                <div>
                  <div className="text-xs text-slate-500 mb-1">Status</div>
                  <StatusBadge status={analyzeResult.new_status} />
                </div>
              </div>
              <dl className="text-sm space-y-2">
                <div><dt className="text-slate-500 inline">무엇이 변했는가: </dt><dd className="inline">{analyzeResult.what_changed}</dd></div>
                <div><dt className="text-slate-500 inline">충돌 전제: </dt><dd className="inline">{analyzeResult.conflicting_premises.join(", ") || "없음"}</dd></div>
                <div><dt className="text-slate-500 inline">종합 판단: </dt><dd className="inline">{analyzeResult.overall_judgment}</dd></div>
                <div><dt className="text-slate-500 inline">관찰 포인트: </dt><dd className="inline">{analyzeResult.watch_points.join(" / ")}</dd></div>
              </dl>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div className="bg-slate-950 rounded-lg p-3 border border-emerald-900/40">
                  <div className="text-xs text-emerald-400 mb-1">Bull Agent</div>
                  <div className="text-sm text-slate-300">{analyzeResult.bull_argument}</div>
                </div>
                <div className="bg-slate-950 rounded-lg p-3 border border-red-900/40">
                  <div className="text-xs text-red-400 mb-1">Bear Agent</div>
                  <div className="text-sm text-slate-300">{analyzeResult.bear_argument}</div>
                </div>
              </div>
            </div>
          )}

          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <h3 className="font-semibold mb-3">Confidence History</h3>
            <div className="space-y-2">
              {thesis.versions.slice().reverse().map((v) => (
                <div key={v.id} className="flex items-center gap-4 text-sm border-b border-slate-800 pb-2 last:border-0">
                  <div className="text-slate-500 w-40 shrink-0">{new Date(v.timestamp).toLocaleString()}</div>
                  <div className="font-semibold w-10">{v.confidence_score}</div>
                  <StatusBadge status={v.status} />
                  <div className="text-slate-400 truncate">{v.reason?.what_changed}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <h3 className="font-semibold mb-3">Evidence History</h3>
            {thesis.evidence.length === 0 && <div className="text-slate-500 text-sm">아직 분석된 증거가 없습니다. "신규 정보로 재분석 실행"을 눌러보세요.</div>}
            <div className="space-y-3">
              {thesis.evidence.slice().reverse().map((ev) => (
                <div key={ev.id} className="text-sm border border-slate-800 rounded-lg p-3">
                  <div className="flex items-center gap-2 mb-1">
                    <span className={`px-2 py-0.5 rounded-full border text-xs ${CLASSIFICATION_STYLES[ev.classification] || ""}`}>{ev.classification}</span>
                    <span className="text-xs text-slate-500">impact: {ev.impact}</span>
                    <span className="text-xs text-slate-600 ml-auto">{ev.related_premise}</span>
                  </div>
                  <div className="text-slate-300">{ev.reasoning}</div>
                  <div className="text-slate-600 text-xs mt-1">source: {ev.source_text}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ModeToggle({ mode, onChange }) {
  return (
    <div className="inline-flex items-center gap-1 bg-slate-900 border border-slate-800 rounded-lg p-1">
      {["mock", "live"].map((m) => (
        <button
          key={m}
          onClick={() => onChange(m)}
          className={`px-3 py-1 rounded-md text-xs font-semibold uppercase tracking-wide ${
            mode === m ? "bg-indigo-600 text-white" : "text-slate-500 hover:text-slate-300"
          }`}
        >
          {m}
        </button>
      ))}
    </div>
  );
}

function App() {
  const [portfolios, setPortfolios] = useState([]);
  const [selectedHolding, setSelectedHolding] = useState(null);
  const [error, setError] = useState(null);
  const [mode, setMode] = useState(ThesisGuardAPI.getMode());

  const loadPortfolios = useCallback(async () => {
    setError(null);
    try {
      setPortfolios(await ThesisGuardAPI.listPortfolios());
    } catch (e) {
      setError(String(e));
    }
  }, []);

  useEffect(() => { loadPortfolios(); }, [loadPortfolios]);

  const changeMode = (m) => {
    ThesisGuardAPI.setMode(m);
    setMode(m);
    setSelectedHolding(null);
    loadPortfolios();
  };

  return (
    <div className="max-w-5xl mx-auto p-6">
      <header className="mb-8 flex items-start justify-between gap-4 flex-wrap">
        <div>
          <h1 className="text-2xl font-bold">ThesisGuard</h1>
          <p className="text-slate-500 text-sm">티커별로 왜 샀는지 기록해두면, 최신 뉴스로 그 논리가 아직 유효한지 계속 확인해줍니다.</p>
          <p className="text-slate-600 text-xs mt-1">
            {mode === "live" ? `API: ${ThesisGuardAPI.LIVE_BASE}` : "mock 데이터로 동작 중 — 백엔드 서버가 필요 없습니다"}
          </p>
        </div>
        <ModeToggle mode={mode} onChange={changeMode} />
      </header>

      {error && (
        <div className="bg-red-500/10 border border-red-500/30 text-red-300 text-sm rounded-lg p-3 mb-6">
          {error} - live 모드에서는 백엔드가 {ThesisGuardAPI.LIVE_BASE} 에서 실행 중이어야 합니다. 안 켜져 있다면 위에서 mock으로 전환하세요.
        </div>
      )}

      {selectedHolding ? (
        <ThesisDetail
          holding={selectedHolding}
          onBack={() => { setSelectedHolding(null); loadPortfolios(); }}
        />
      ) : (
        <RepositoryView
          portfolios={portfolios}
          onSelectHolding={setSelectedHolding}
          onAdded={(holding) => { loadPortfolios(); if (holding) setSelectedHolding(holding); }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
